[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oepnv-accessibility"
version = "1.0.0"
description = "Reproduzierbare Erreichbarkeitsberechnung und Kartenerstellung für Westfalen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bachelorarbeitsprojekt"}]
dependencies = [
  "folium>=0.17",
  "geopandas>=1.0",
  "numpy>=1.26",
  "osmium>=4.0",
  "pandas>=2.2",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "r5py==1.1.7",
  "scipy>=1.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.10", "build==1.6.1"]

[project.scripts]
accessibility = "accessibility.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessibility = ["evaluation_canvas.js", "templates/*.j2", "templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
